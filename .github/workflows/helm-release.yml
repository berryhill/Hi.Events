name: Publish Helm image
on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - 'frontend/**'
      - 'docker/all-in-one/**'
      - 'Dockerfile.all-in-one'
      - '.dockerignore'
      - 'helm/**'
      - '.github/workflows/helm-release.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: hievents-publish
  cancel-in-progress: false
jobs:
  publish:
    if: github.repository == 'berryhill/Hi.Events' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4
        with:
          version: v3.17.3
      - run: python3 -m pip install PyYAML==6.0.2
      - run: python3 helm/test_chart.py
      - name: Validate public build settings
        env:
          VITE_FRONTEND_URL: ${{ secrets.VITE_FRONTEND_URL }}
          VITE_API_URL_CLIENT: ${{ secrets.VITE_API_URL_CLIENT }}
          VITE_APP_NAME: ${{ secrets.VITE_APP_NAME }}
        run: |
          test "$VITE_FRONTEND_URL" = "https://admin.elementafestival.com"
          test "$VITE_API_URL_CLIENT" = "https://admin.elementafestival.com/api"
          test -n "$VITE_APP_NAME"
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8
        id: build
        with:
          context: .
          file: Dockerfile.all-in-one
          platforms: linux/amd64
          push: true
          tags: ghcr.io/berryhill/hi.events:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/berryhill/Hi.Events
            org.opencontainers.image.revision=${{ github.sha }}
          build-args: |
            VITE_FRONTEND_URL=${{ secrets.VITE_FRONTEND_URL }}
            VITE_API_URL_CLIENT=${{ secrets.VITE_API_URL_CLIENT }}
            VITE_APP_NAME=${{ secrets.VITE_APP_NAME }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Record immutable image
        env:
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          printf 'Image: `ghcr.io/berryhill/hi.events@%s`\n' "$IMAGE_DIGEST" >> "$GITHUB_STEP_SUMMARY"
          printf '%s\n' "$IMAGE_DIGEST" > image-digest.txt
      - uses: actions/upload-artifact@v4
        with:
          name: image-digest
          path: image-digest.txt
